# Configuracion SOLO para pruebas automatizadas (mvn test).
# H2 en memoria en modo de compatibilidad SQL Server, con un esquema que replica
# las tablas reales (Envio, Vehiculo, Conductor, PAQUETES). ddl-auto=validate
# comprueba que el mapeo JPA coincide con ese esquema, igual que en SQL Server.
# Cada contexto de Spring usa su propia BD en memoria (random.uuid) para no chocar.
spring.datasource.url=jdbc:h2:mem:expresofast-${random.uuid};MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.data-locations=classpath:data-test.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
