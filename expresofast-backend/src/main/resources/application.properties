# ExpresoFast - Laboratorio 11
spring.application.name=expresofast-backend
server.port=8080

# Base de datos SQL Server de los laboratorios 5 a 9 (ExpresoFastC5K023_II2026).
# La contrasena NO se guarda en el repositorio: se lee de la variable de entorno DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ExpresoFastC5K023_II2026;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
# validate: Hibernate solo comprueba que las entidades coincidan con las tablas creadas
# por los scripts T-SQL; nunca modifica el esquema.
spring.jpa.hibernate.ddl-auto=validate
# Respeta exactamente los nombres de tabla y columna indicados en @Table y @Column.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
